# Ворота входа в лесенку (когда вообще начинать ротацию в альты).
# Открыты, когда доля топ-100, обгоняющих BTC за 30 дней, >= alts_threshold_pct
# И доминация BTC ниже, чем dominance_lookback_days назад. Классический Altcoin Season
# Index считает по 90 дням; у бесплатного CoinGecko такого окна нет, поэтому 30 дней —
# сигнал чувствительнее, и второе условие (доминация) страхует от ложного открытия.
entry_gate:
  alts_threshold_pct: 50           # 75 — строже (как «настоящий» альтсезон), 50 — начало ротации
  dominance_lookback_days: 28

# Сигнал выхода из ВСЕГО портфеля в стейблы (не путать с entry_gate — тот про ротацию
# BTC -> альты). Два независимых источника розничной эйфории; срабатывает ЛЮБОЙ.
# Уровень «разогрев» — заранее подготовить план выхода, а не продавать.
exit_signal:
  trends_sell_pct: 90        # перцентиль Google Trends «bitcoin» за 5 лет: >= -> продавать
  trends_warming_pct: 75     # >= -> разогрев
  coinbase_sell_rank: 10     # ранг в общем топе App Store: <= -> продавать (201 = вне топ-200)
  coinbase_warming_rank: 50  # <= -> разогрев

# Веса композитного скора «лесенки» (этап 5). Сумма не обязана быть = 1.
scoring:
  github_core_devs: 0.5     # ядро: моментум активных разработчиков команды, 28д/84д (ф.5)
  github_ecosystem: 1.0     # экосистема: моментум новых репо по топику 12нед/24нед — разработка НА платформе (ф.5)
  trends_momentum: 1.0
  mentions_momentum: 1.0
  node_growth: 1.0
  unlock_pressure: -1.0     # навес разлоков — штраф
  team_selling: -1.5        # продажи команды — сильный штраф
  # Nansen (ф.11). Свежие кошельки и биржи — нетто-поток за 7д, нормированный на капитализацию,
  # среднее последних снапшотов за 28 дней. SM-перпы — перекос позиций Smart Money на Hyperliquid.
  fresh_wallets_flow: 1.0   # приток на свежие кошельки = аккумуляция
  exchange_flow: -0.5       # приток НА биржи = навес продаж, штраф
  sm_perp_skew: 1.0         # (лонги−шорты)/(лонги+шорты) Smart Money, все 9 монет
  discord_activity: 0.5
  tvl_momentum: 1.0         # DefiLlama: приток капитала в сеть (TVL, 28д/84д)
  fees_momentum: 0.5        # DefiLlama: комиссии сети = реальное использование
  # Цена и оценка стоимости (добавлены 24.09.2026). Остальные факторы меряют ускорение
  # активности; эти два — обгоняет ли монета BTC и сколько платят за реальное использование.
  rel_strength_btc: 1.0     # (рост монеты / рост BTC) за 90д − 1: ценовой моментум vs BTC
  fees_to_mcap: 0.5         # годовые комиссии сети / капитализация (аналог P/E, выше = дешевле)
