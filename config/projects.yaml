# Утверждённый пул монет. Кандидатов подбирает скринер (python -m app screen),
# сюда вы вручную переносите то, что утвердили.
#
# Поля проекта:
#   name, symbol         — отображение
#   coingecko_id         — id на CoinGecko (для капы/объёма/genesis)
#   binance_symbol       — пара на Binance для полной истории цены (напр. SOLUSDT)
#   chain                — своя сеть (для коллектора нод) или сеть токена
#   github               — список репозиториев "org/repo" (основные, 1-3 шт.) — ядро (ф.5)
#   nansen               — {chain, token_address} для Nansen API (ф.11): потоки бирж и
#                          свежих кошельков по нативной монете. Адреса резолвятся
#                          бесплатным search/general; сети вне списка Nansen (Celestia,
#                          Aptos, Bittensor) поле не задают — фактор честно пропускается.
#   hyperliquid_symbol   — тикер на Hyperliquid, если не совпадает с symbol (перпы, ф.11)
#   github_topic         — GitHub-топик экосистемы для ф.5 «разработка на платформе»
#                          (новые репо с topic:<...> в неделю через Search API); по умолчанию = id.
#                          Один топик на проект; проверено 2026-08-18 по населённости и шуму.
#   trends_keyword       — запрос для Google Trends (обычно название)
#   twitter_project      — @хэндл проекта (ручная курация, ф.6)
#   twitter_ceo          — @хэндл CEO (ф.13, слот под X API / ручной ввод)
#   discord_export_dir   — папка с JSON-экспортами DiscordChatExporter (ф.12)
#   wallets              — помеченные кошельки команды/фонда/инвесторов (ф.7, 11).
#                          Адреса берите из меток Arkham/Etherscan/Nansen-public —
#                          НЕ заполняйте наугад.
#     - chain: ethereum
#       address: "0x..."
#       label: team | foundation | investor
#       name: "Team vesting 1"
#   token_contracts      — контракт токена для он-чейн эвристик (ф.11), напр.
#     token_contracts: { ethereum: "0x..." }
#
#   DefiLlama перенёс raises/emissions в платный Pro (нужен DEFILLAMA_API_KEY).
#   Бесплатная альтернатива — ручной ввод (данные публичны, 5 минут на монету):
#   funding_rounds       — раунды с cryptorank.io / messari.io (ф.4):
#     - { date: 2021-06-09, round: "Series A", amount_usd: 314000000,
#         investors: [a16z, Polychain] }
#   unlock_events        — клифы с token.unlocks.app / cryptorank.io/unlocks (ф.7),
#                          будущие тоже (лягут оверлеем на график цены):
#     - { date: 2026-10-30, tokens: 175000000, note: "team + investors cliff" }

projects:
