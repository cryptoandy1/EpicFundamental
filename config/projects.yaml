# Скринер (ф.3): фильтры отбора кандидатов из CoinGecko
screener:
  min_market_cap: 100000000        # ≥ $100M
  max_market_cap: 50000000000      # ≤ $50B (было 20 — лидеры 2026 ZEC/HYPE выросли выше потолка)
  min_volume_24h: 10000000         # ≥ $10M/сутки
  max_fdv_mc_ratio: 3.0            # FDV/MC ≤ 3 (не сплошной навес разлоков)
  categories:                      # интересующие категории CoinGecko (пусто = все)
    - layer-1
    - data-availability
    - modular-blockchain
  # Наблюдательный список: попадают в снапшот ВСЕГДА, даже не пройдя фильтры —
  # в «Причине» видно, какие именно не прошли. Нужен, чтобы лидеры не исчезали из
  # поля зрения (23.09.2026: HYPE режется по FDV/MC ≈ 4, ZEC прошёл бы капу только после
  # подъёма потолка до $50B — 12.08 он был $8.3B и был крупнейшим кандидатом).
  always_include:
    - hyperliquid
    - zcash

